<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JALNETRA Responder - Field Interface</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design System Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed-dim": "#bcc7de",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#45474c",
                        "secondary-container": "#39b8fd",
                        "secondary": "#006591",
                        "outline-variant": "#c5c6cd",
                        "on-tertiary-fixed-variant": "#564427",
                        "surface-tint": "#545f73",
                        "inverse-primary": "#bcc7de",
                        "primary-fixed": "#d8e3fb",
                        "on-primary-fixed-variant": "#3c475a",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#004c6e",
                        "surface-container-low": "#f2f4f6",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1e",
                        "surface-container": "#eceef0",
                        "on-primary": "#ffffff",
                        "background": "#f7f9fb",
                        "on-primary-fixed": "#111c2d",
                        "outline": "#75777d",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#89ceff",
                        "primary": "#091426",
                        "on-tertiary-container": "#a38c6a",
                        "tertiary": "#1e1200",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#271902",
                        "surface-bright": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#001e2f",
                        "tertiary-fixed-dim": "#ddc39d",
                        "on-error": "#ffffff",
                        "on-primary-container": "#8590a6",
                        "tertiary-container": "#35260c",
                        "surface-container-high": "#e6e8ea",
                        "surface": "#f7f9fb",
                        "primary-container": "#1e293b",
                        "inverse-on-surface": "#eff1f3",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-container": "#004666",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#fadfb8",
                        "secondary-fixed": "#c9e6ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "stack-gap": "12px",
                        "grid-columns-desktop": "12",
                        "grid-columns-mobile": "4",
                        "container-margin-desktop": "32px",
                        "gutter": "16px",
                        "unit": "4px",
                        "container-margin-mobile": "16px"
                    },
                    fontFamily: {
                        "mono-data": ["monospace"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "mono-data": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
                        "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }],
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Base styles to prevent scrolling on app shell */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col antialiased">
<!-- Incident Header (Task-Focused Overlay) -->
<header class="bg-error text-on-error px-container-margin-mobile pt-12 pb-5 flex flex-col gap-2 relative z-20 shadow-md rounded-b-xl">
<div class="flex justify-between items-center mb-1">
<div class="flex items-center gap-1.5 bg-on-error/20 px-2.5 py-1 rounded-sm border border-on-error/30">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest font-bold">Priority: CRITICAL</span>
</div>
<button class="p-2 rounded-full h-11 w-11 flex items-center justify-center bg-black/10 active:bg-black/20 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight">INCIDENT #204</h1>
<p class="font-body-md text-body-md opacity-90">Current Assignment - Sector B</p>
<div class="mt-3 bg-black/15 p-3.5 rounded-lg flex items-center justify-between border border-white/10 shadow-inner">
<span class="font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">schedule</span> Target: Hazard Arrival
            </span>
<span class="font-mono-data text-mono-data text-xl font-bold tracking-wider">22m 14s</span>
</div>
</header>
<!-- Main Content Area (Map Canvas) -->
<main class="flex-1 relative bg-surface-variant overflow-hidden">
<!-- Map Background -->
<div class="absolute inset-0 bg-[#e2e8f0]">
<img class="w-full h-full object-cover" data-alt="A highly detailed, top-down satellite map view of an urban sector showing streets, buildings, and critical infrastructure. The map uses a high-contrast, modern corporate color palette suitable for a professional disaster response interface. Muted greys form the base, while a distinct, vivid blue line indicates a calculated navigation route through the city grid." data-location="Sector B" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBviLuQ9G5xAIHP4RkIlWSLdW7KXSg4gKq-jlpqT2TgImhFz1sZZSICGiNQhNnUwN1dapXcOnYoIuvEZKNgX8aYsgDCOIbIkgypAEJqcGaljQkZSXXzptimYPCVko9PNlFP6UblaVnvsvSWff0esuAOCoCdKN4NMW3QfiZkEU4jwOZBeKuw1Fo2XIp3rYfylmZSB3KJ720VVP66ROYUUFp_YzGEw8QPQTT9viT693Br3ZsLGOVstsFO-g"/>
</div>
<!-- Turn-by-turn Overlay -->
<div class="absolute top-4 left-4 right-4 bg-surface-container-lowest border border-outline-variant rounded-xl p-3.5 shadow-md flex items-center gap-4 z-10">
<div class="bg-secondary text-on-secondary p-2 rounded-lg h-12 w-12 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">turn_right</span>
</div>
<div class="flex-1">
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">In 200 meters</div>
<div class="font-headline-md text-[20px] font-bold text-on-surface leading-tight mt-0.5">Turn right onto Industrial Blvd</div>
</div>
<button class="bg-primary text-on-primary font-label-sm text-label-sm rounded-lg px-4 py-2 font-bold flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">navigation</span> NAVIGATE
</button>
</div>
<!-- Road Status Badge -->
<div class="absolute top-24 right-4 bg-[#059669] text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm border border-[#047857] z-10">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider font-bold">Road Clear</span>
</div>
<!-- Telemetry Data Card (Floating Bottom) -->
<div class="absolute bottom-4 left-4 right-4 bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-md z-10 hidden">
<div class="flex justify-between items-end mb-3 border-b border-outline-variant/30 pb-2">
<div>
<div class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1 mb-1 uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">sensors</span> Nearest Sensor
                    </div>
<div class="font-body-md text-body-md font-semibold text-on-surface">Alpha-7 (Main Channel)</div>
</div>
<div class="text-right">
<div class="font-label-sm text-label-sm text-error flex items-center gap-1 justify-end font-bold bg-error-container px-2 py-0.5 rounded-sm">
<span class="material-symbols-outlined text-[14px]">trending_up</span> Rising
                    </div>
</div>
</div>
<div class="bg-surface-container-low p-3 rounded-lg flex items-center justify-between border border-outline-variant/50">
<span class="font-body-md text-body-md text-on-surface-variant font-medium">Real-time Water Level</span>
<span class="font-mono-data text-mono-data font-bold text-xl text-primary bg-primary/5 px-2 py-1 rounded">4.28m</span>
</div>
</div>
</main>
<!-- Action Bar (Task Workflow) -->
<footer class="bg-surface border-t border-outline-variant px-container-margin-mobile pt-4 pb-8 relative z-20 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
<div class="flex flex-col gap-3">
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                ACCEPT ASSIGNMENT
            </button>
<!-- Secondary/Sequential Actions -->
<div class="flex gap-3">
<button class="flex-1 h-[48px] bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md rounded-lg flex items-center justify-center gap-1.5 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[18px]">location_on</span> ARRIVED
                </button>
<button class="flex-1 h-[48px] bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md rounded-lg flex items-center justify-center gap-1.5 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[18px]">verified</span> RESOLVED
                </button>
</div>
</div>
</footer>
</body></html>
